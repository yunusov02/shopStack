[project]
name = "shopstack"
version = "0.1.0"
description = "shopStack ERP"
readme = "README.md"
authors = [
    { name = "asilbek", email = "as.yunusov@agmk.uz" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard,standart]>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]


[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
    'E501', # line too long
    'F401', # unused import
    'E',
    'F',
    'I',
    'B',
    'UP',
    'SIM',
    'RUF',
    'DTZ', # naive datetime
    'ASYNC', # async function
    'T20' # print statement
]
