[project]
name = "shopstack"
version = "0.1.0"
description = "ERP shopstack application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]



[tool.ruff]
line-length = 100

src=['src']

[tool.ruff.lint]
extend-select = [
    "I",    # isort
    "E",    # pycodestyle errors
    "B",    # flake8-bug
    "UP",   # pyupgrade
    "SIM",  # flake8-simply
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"




[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
