repos:
  - repo: local
    hooks:
      # Ruff Formatting
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      # Ruff Linting
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      # Mypy Typechecking
      - id: "mypy-check"
        name: Mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        always_run: true
      
